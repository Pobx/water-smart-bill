# Container-First Demo Stack for Water Smart Bill (ระบบบริหารจัดการค่าน้ำประปา อบต.)
name: water-smart-bill

services:
  postgres:
    image: postgres:16-alpine
    container_name: water-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-water}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-water_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-water_smart_bill}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: guarantees the Keycloak database exists even when the postgres volume
  # was created earlier (init scripts only run on an EMPTY data volume).
  db-init:
    image: postgres:16-alpine
    container_name: water-db-init
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-water_dev_password}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        PG_USER="${POSTGRES_USER:-water}"
        PG_DB="${POSTGRES_DB:-water_smart_bill}"
        KC_DB="${KEYCLOAK_DB:-keycloak}"
        echo "Waiting for postgres to accept connections..."
        until pg_isready -h postgres -U "$$PG_USER" -d "$$PG_DB" >/dev/null 2>&1 && \
              psql -h postgres -U "$$PG_USER" -d "$$PG_DB" -tAc "SELECT 1" >/dev/null 2>&1; do
          echo "postgres is not ready yet, retrying in 2s..."
          sleep 2
        done
        if psql -h postgres -U "$$PG_USER" -d "$$PG_DB" -tAc "SELECT 1 FROM pg_database WHERE datname='$$KC_DB'" | grep -q 1; then
          echo "database $$KC_DB already exists"
        else
          echo "creating database $$KC_DB..."
          psql -h postgres -U "$$PG_USER" -d "$$PG_DB" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$$KC_DB\""
        fi
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: water-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: water-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-water}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-water_dev_password}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm-water.json:/opt/keycloak/data/import/realm-water.json:ro
      - ./keycloak/themes/water-smart-bill:/opt/keycloak/themes/water-smart-bill:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  backend:
    build:
      context: ../backend-go
    image: water-smart-bill-backend:demo
    container_name: water-backend
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: ${APP_ENV:-demo}
      DATABASE_URL: postgres://${POSTGRES_USER:-water}:${POSTGRES_PASSWORD:-water_dev_password}@postgres:5432/${POSTGRES_DB:-water_smart_bill}?sslmode=disable
      REDIS_ADDR: "redis:6379"
      UPLOAD_DIR: "/data/uploads"
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/water-smart-bill
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/water-smart-bill/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: "water-api"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend-react
    image: water-smart-bill-frontend:demo
    container_name: water-frontend
    restart: unless-stopped
    environment:
      KEYCLOAK_AUTHORITY: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/water-smart-bill
      KEYCLOAK_CLIENT_ID: "water-web"
      API_BASE_URL: "/api"

  nginx:
    image: nginx:1.27-alpine
    container_name: water-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  uploads_data:
